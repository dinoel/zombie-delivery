<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QA: vehicle damage</title>
  <style>
    html,body{margin:0;background:#171d2b;color:#e9edf3;font:14px system-ui,sans-serif}
    main{width:720px;margin:24px auto} h1{font-size:20px;margin:0 0 10px}
    canvas{display:block;background:#29313e;border:1px solid #566176;border-radius:10px}
    #hiddenUi{display:none}
  </style>
</head>
<body>
  <main><h1>Persistent damage visual check</h1><canvas id="c" width="720" height="260"></canvas></main>
  <div id="hiddenUi"><div id="overlay"><h1></h1><h2></h2><p></p></div><button id="startBtn"></button>
    <span id="lvl"></span><span id="box"></span><span id="ammo"></span><span id="lives"></span>
    <span id="time"></span><span id="best"></span><select id="qualitySelect"><option value="low">low</option></select>
    <span id="qualityStatus"></span></div>
  <script src="../src/namespace.js?v=20260726-20"></script>
  <script src="../src/core.js?v=20260726-20"></script>
  <script src="../src/quality.js?v=20260726-20"></script>
  <script src="../src/audio.js?v=20260726-20"></script>
  <script src="../src/car-physics.js?v=20260726-20"></script>
  <script src="../src/environment.js?v=20260726-20"></script>
  <script src="../src/world.js?v=20260726-20"></script>
  <script>
    (() => {
      const { drawCarShape } = TownGame.world;
      const { newCarDamage, damageCar } = TownGame.environment;
      const ctx = document.getElementById('c').getContext('2d');
      const game = { p:{x:999,y:999}, zombies:[], weather:{rain:0}, rings:[], parts:[], shake:0, carsBroken:0 };
      const make = (col, police=false) => ({ x:0,y:0,hx:1,hy:0,v:130,col,police,beacon:1.2,honk:0,
        damage:newCarDamage(),broken:false,hazard:0,stall:0,creep:0,hold:false,jx:0,jy:0,seed:.41 });
      const cars = [make('#a84f45'),make('#4174a8'),make('#d0d4db',true),make('#8a6aac')];
      const bulletContact=TownGame.carPhysics.segmentCarContact(cars[1],45,0,0,0);
      TownGame.environment.damageCarWithBullet(game,cars[1],bulletContact,{vx:-680,vy:0});
      TownGame.environment.damageCarWithPlayer(game,cars[2],{x:30,y:-8});
      damageCar(game,cars[3],260,1,0); cars[3].hazard=17.8;
      const labels=['INTACT','SHOT','PLAYER IMPACT','CAR-TO-CAR'];
      ctx.textAlign='center'; ctx.font='600 13px system-ui';
      cars.forEach((car,i)=>{
        const x=92+i*178,y=128;
        ctx.fillStyle='#e6ebf2';ctx.fillText(labels[i],x,38);
        ctx.save();ctx.translate(x,y);ctx.scale(3.1,3.1);drawCarShape(ctx,car);ctx.restore();
        ctx.fillStyle='#aab4c2';ctx.font='12px system-ui';
        const d=car.damage;ctx.fillText(`body ${Math.round(d.integrity)}% · engine ${Math.round(d.engine)}%`,x,222);
      });
    })();
  </script>
</body>
</html>
